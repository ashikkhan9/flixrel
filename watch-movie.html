<!-- ========== মোবাইল ফ্রেন্ডলি ভিডিও প্লেয়ার ও সার্ভার কোড ========== -->
<div style="width: 100%; max-width: 1000px; margin: 10px auto; text-align: center; font-family: sans-serif; box-sizing: border-box; padding: 0 10px;">
  
  <!-- মোবাইল ও পিসির জন্য নিরাপদ রেসপন্সিভ প্লেয়ার কন্টেইনার -->
  <div id="player-wrapper" style="width: 100%; height: 280px; max-height: 500px; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative;">
    <iframe id="video-player" src="" 
            style="width: 100%; height: 100%; border: none;" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true">
    </iframe>
  </div>

  <!-- সার্ভার সিলেকশন বাটন -->
  <div id="server-buttons" style="margin-top: 15px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
    <button onclick="changeServer(1)" style="padding: 10px 15px; cursor: pointer; background: #e50914; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 13px;">Server 1 (VidSrc)</button>
    <button onclick="changeServer(2)" style="padding: 10px 15px; cursor: pointer; background: #333; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 13px;">Server 2 (PRO)</button>
    <button onclick="changeServer(3)" style="padding: 10px 15px; cursor: pointer; background: #333; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 13px;">Server 3 (ME)</button>
    <button onclick="changeServer(4)" style="padding: 10px 15px; cursor: pointer; background: #333; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 13px;">Server 4 (SU)</button>
  </div>

  <!-- ১-ক্লিক ফুল-স্ক্রিন বোতাম -->
  <button onclick="goFullScreen()" style="margin-top: 12px; padding: 12px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 15px; width: 100%;">
    📺 Full Screen (ফুল স্ক্রিন করুন)
  </button>

</div>

<script>
  // URL থেকে মুভির ID বা লোকাল স্টোরেজ থেকে আইডি নেওয়া
  const urlParams = new URLSearchParams(window.location.search);
  let tmdbId = urlParams.get('id') || urlParams.get('tmdb') || urlParams.get('movie') || localStorage.getItem('selected_movie_id') || "299534";

  // সার্ভার লিংকসমূহ
  const servers = {
    1: `https://vidsrc.to/embed/movie/${tmdbId}`,
    2: `https://vidsrc.pro/embed/movie/${tmdbId}`,
    3: `https://vidsrc.me/embed/movie?tmdb=${tmdbId}`,
    4: `https://embed.su/embed/movie/${tmdbId}`
  };

  // সার্ভার পরিবর্তন ও স্টাইল আপডেট ফাংশন
  function changeServer(serverNumber) {
    const player = document.getElementById('video-player');
    
    const buttons = document.getElementById('server-buttons').getElementsByTagName('button');
    for (let i = 0; i < buttons.length; i++) {
      if (i === (serverNumber - 1)) {
        buttons[i].style.background = '#e50914'; 
      } else {
        buttons[i].style.background = '#333';    
      }
    }

    if (servers[serverNumber]) {
      player.src = servers[serverNumber];
    }
  }

  // ফুল-স্ক্রিন ফাংশন
  function goFullScreen() {
    const wrapper = document.getElementById('player-wrapper');
    if (wrapper.requestFullscreen) {
        wrapper.requestFullscreen();
    } else if (wrapper.webkitRequestFullscreen) { 
        wrapper.webkitRequestFullscreen();
    } else if (wrapper.msRequestFullscreen) { 
        wrapper.msRequestFullscreen();
    } else if (wrapper.mozRequestFullScreen) { 
        wrapper.mozRequestFullScreen();
    }
  }

  // পেজ লোড হলে ১ নম্বর সার্ভার প্লে হবে
  window.onload = function() {
    changeServer(1);
  };
</script>
<!-- ========== কোড শেষ ========== -->
