<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video - Flixrel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <!-- HLS.js for .m3u8 video playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { background-color: #0b0f19; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    
    .player-container {
      position: relative;
      width: 100%;
      height: 40vh;
      background: #000;
    }
    @media (min-width: 640px) { .player-container { height: 60vh; } } 
    @media (min-width: 1024px) { .player-container { height: 80vh; } } 
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="p-4 border-b border-white/10 flex items-center justify-between glass sticky top-0 z-50">
    <a href="index.html" class="text-lg sm:text-xl font-bold text-indigo-400 hover:text-indigo-300 transition flex items-center gap-2">
      <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Back to Home</span>
    </a>
    <div class="text-xl font-bold bg-gradient-to-r from-white to-indigo-200 bg-clip-text text-transparent">Flixrel</div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col items-center w-full max-w-6xl mx-auto sm:p-4">
    <div class="w-full sm:rounded-2xl overflow-hidden glass shadow-2xl flex flex-col">
      
      <!-- Player Container -->
      <div class="player-container flex items-center justify-center">
        <p id="loading-text" class="absolute text-white/50 text-lg flex items-center gap-2 z-10">
          <i class="fa-solid fa-spinner fa-spin"></i> Loading video...
        </p>
        
        <video id="video-player" class="w-full h-full object-contain hidden relative z-20" controls playsinline webkit-playsinline></video>
        
        <iframe id="iframe-player" class="w-full h-full hidden relative z-20" frameborder="0" allowfullscreen></iframe>
      </div>

      <!-- Video Details -->
      <div class="p-5 sm:p-8">
        <h1 id="video-title" class="text-xl sm:text-3xl font-bold mb-2">Loading Title...</h1>
        <p id="video-meta" class="text-indigo-400 text-xs sm:text-sm font-semibold mb-6 tracking-wider uppercase"></p>
        
        <a id="download-btn" href="#" target="_blank" class="hidden inline-flex items-center gap-2 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white px-5 py-2.5 sm:px-6 sm:py-3 rounded-xl font-bold transition shadow-lg shadow-emerald-500/20 text-sm sm:text-base">
          <i class="fa-solid fa-download"></i> Download Video
        </a>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC149Y2CR46kYH2StZCJXc-87BP9EroIcg",
      authDomain: "flixrel.firebaseapp.com",
      projectId: "flixrel",
      storageBucket: "flixrel.firebasestorage.app",
      messagingSenderId: "838788026123",
      appId: "1:838788026123:web:dfca0835a24b4816499c0e"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('id');
    
    const loadingText = document.getElementById('loading-text');
    const videoEl = document.getElementById('video-player');
    const iframeEl = document.getElementById('iframe-player');

    if (!videoId) {
      loadingText.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-500"></i> Error: No video selected!';
    } else {
      db.collection("movies").doc(videoId).get().then((doc) => {
        if (!doc.exists) {
          loadingText.innerHTML = '<i class="fa-solid fa-ghost text-red-500"></i> Video not found or deleted!';
          return;
        }
        
        const data = doc.data();
        
        document.getElementById('video-title').innerText = data.title || "Untitled Video";
        document.getElementById('video-meta').innerText = (data.releaseYear || '') + ' • ' + (data.type || 'Viral');
        
        if (data.downloadUrl && data.downloadUrl.trim() !== "") {
          const dlBtn = document.getElementById('download-btn');
          dlBtn.href = data.downloadUrl;
          dlBtn.classList.remove('hidden');
        }

        const videoUrl = data.videoUrl || data.embedUrl || "";
        loadingText.style.display = "none";

        if (videoUrl.includes('.m3u8') || videoUrl.includes('.mp4')) {
          videoEl.classList.remove('hidden');
          
          if (videoUrl.includes('.m3u8')) {
            if (Hls.isSupported()) {
              
              // 🔥 ADVANCED AUTO-NETWORK & BUFFERING SYSTEM 🔥
              const hls = new Hls({
                // ১. নেটওয়ার্ক অনুযায়ী অটোমেটিক কোয়ালিটি ওঠানামা করবে (Auto Bitrate)
                startLevel: -1, // -1 মানে অটোমেটিক
                capLevelToPlayerSize: true, // স্ক্রিন অনুযায়ী কোয়ালিটি অ্যাডজাস্ট
                
                // ২. এডভান্সড বাফারিং (তোমার কথামতো আগে থেকে ১০, ৩০, ৭০ সেকেন্ড লোড করে রাখবে)
                maxBufferLength: 30,        // মিনিমাম ৩০ সেকেন্ড আগে থেকে রেডি রাখবে
                maxMaxBufferLength: 70,     // ম্যাক্সিমাম ৭০ সেকেন্ড পর্যন্ত ডাউনলোড করে রাখবে
                maxBufferSize: 100 * 1024 * 1024, // ৭০ সেকেন্ড রাখার জন্য ১০০ এমবি পর্যন্ত মেমোরি ইউজ করবে
                
                // ৩. নেটওয়ার্ক ড্রপ বা খারাপ হলে বারবার ট্রাই করার সিস্টেম
                fragLoadingTimeOut: 20000,
                fragLoadingMaxRetry: 6,     // নেট ছেড়ে দিলে ৬ বার অটো ট্রাই করবে
                manifestLoadingMaxRetry: 6
              });

              hls.loadSource(videoUrl);
              hls.attachMedia(videoEl);
              hls.on(Hls.Events.MANIFEST_PARSED, function() {
                videoEl.play().catch(() => console.log("Autoplay blocked."));
              });
              
              // যদি নেটওয়ার্কের কারণে প্লে আটকে যায়, তাহলে অটো রিকভারি করবে
              hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                  switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                      console.log("Network error, trying to recover...");
                      hls.startLoad();
                      break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                      console.log("Media error, trying to recover...");
                      hls.recoverMediaError();
                      break;
                    default:
                      hls.destroy();
                      break;
                  }
                }
              });

            } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
              videoEl.src = videoUrl;
              videoEl.play();
            }
          } else {
            videoEl.src = videoUrl;
            videoEl.play().catch(() => console.log("Autoplay blocked."));
          }
        } else {
          iframeEl.src = videoUrl;
          iframeEl.classList.remove('hidden');
        }
      }).catch(error => {
        loadingText.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-500"></i> Failed to connect to database.';
      });
    }
  </script>
</body>
</html>
