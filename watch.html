  <style>
    body { background-color: #0b0f19; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    
    /* 🎬 YouTube Style 16:9 Player Container */
    .player-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9; /* ইউটিউবের মতো স্ট্যান্ডার্ড রেশিও */
      height: auto;
      background: #000;
      overflow: hidden;
    }
    @media (min-width: 640px) { .player-container { max-height: 80vh; } } 

    /* মাউস কার্সর লুকানোর জন্য */
    .player-container.idle {
      cursor: none;
    }

    /* Custom YouTube-style Red Progress Bar */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 5px;
      outline: none;
      cursor: pointer;
      transition: height 0.2s ease;
    }
    input[type=range]:hover { height: 6px; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff0000;
      cursor: pointer;
      transition: transform 0.2s;
    }
    input[type=range]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff0000;
      cursor: pointer;
      border: none;
    }
    input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.3); }
    
    /* Controls Overlay */
    .controls-overlay {
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none; /* লুকানো অবস্থায় ক্লিক যাতে না লাগে */
    }
    .controls-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="p-4 border-b border-white/10 flex items-center justify-between glass sticky top-0 z-50">
    <a href="index.html" class="text-lg sm:text-xl font-bold text-indigo-400 hover:text-indigo-300 transition flex items-center gap-2">
      <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Back to Home</span>
    </a>
    <div class="text-xl font-bold bg-gradient-to-r from-white to-indigo-200 bg-clip-text text-transparent">Flixrel</div>
  </header>

  <main class="flex-1 flex flex-col items-center w-full max-w-6xl mx-auto sm:p-4">
    <div class="w-full sm:rounded-2xl overflow-hidden glass shadow-2xl flex flex-col">
      
      <!-- Video Player Container -->
      <div id="video-wrapper" class="player-container flex items-center justify-center group">
        
        <!-- Loading UI -->
        <div id="loading-text" class="absolute bg-black/80 px-6 py-3 rounded-xl border border-red-500/30 text-white text-lg flex items-center gap-3 z-40 shadow-2xl">
          <i class="fa-solid fa-spinner fa-spin text-red-500 text-2xl"></i> 
          <span id="wait-message" class="font-semibold">Loading video...</span>
        </div>
        
        <video id="video-player" class="w-full h-full object-contain hidden relative z-10" playsinline webkit-playsinline preload="auto"></video>
        
        <!-- Double Tap Zones -->
        <div id="left-tap-zone" class="absolute left-0 top-0 w-1/3 h-full z-20 hidden"></div>
        <div id="right-tap-zone" class="absolute right-0 top-0 w-1/3 h-full z-20 hidden"></div>

        <!-- Custom Controls -->
        <div id="custom-controls" class="controls-overlay absolute bottom-0 left-0 right-0 px-4 pb-4 pt-16 bg-gradient-to-t from-black/90 via-black/40 to-transparent z-30 flex flex-col gap-3 hidden">
          
          <div class="w-full relative flex items-center">
            <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1">
          </div>

          <div class="flex items-center justify-between text-white">
            <div class="flex items-center gap-4 sm:gap-6">
              <button id="play-pause-btn" class="text-xl sm:text-2xl hover:text-red-500 transition"><i class="fa-solid fa-play"></i></button>
              
              <button id="rewind-btn" class="hover:text-red-500 transition flex items-center gap-1 text-sm sm:text-base">
                <i class="fa-solid fa-rotate-left"></i> <span>10s</span>
              </button>
              <button id="forward-btn" class="hover:text-red-500 transition flex items-center gap-1 text-sm sm:text-base">
                <span>10s</span> <i class="fa-solid fa-rotate-right"></i>
              </button>

              <span id="time-display" class="text-xs sm:text-sm font-medium text-gray-300">00:00 / 00:00</span>
            </div>
            <button id="fullscreen-btn" class="text-lg sm:text-xl hover:text-red-500 transition"><i class="fa-solid fa-expand"></i></button>
          </div>
        </div>

        <iframe id="iframe-player" class="w-full h-full hidden relative z-20" frameborder="0" allowfullscreen></iframe>
      </div>

      <!-- ⭐ BANNER AD (468x60) - Centered below the player ⭐ -->
      <div class="w-full flex justify-center items-center py-4 bg-black/30 border-b border-white/5 min-h-[70px]">
        <script>
          atOptions = {
            'key' : 'e88042630b040c15b26b14de3dc42a4b',
            'format' : 'iframe',
            'height' : 60,
            'width' : 468,
            'params' : {}
          };
        </script>
        <script src="https://www.highperformanceformat.com/e88042630b040c15b26b14de3dc42a4b/invoke.js"></script>
      </div>

      <div class="p-5 sm:p-8">
        <h1 id="video-title" class="text-xl sm:text-3xl font-bold mb-2">Loading Title...</h1>
        <p id="video-meta" class="text-gray-400 text-xs sm:text-sm font-semibold tracking-wider uppercase"></p>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC149Y2CR46kYH2StZCJXc-87BP9EroIcg",
      authDomain: "flixrel.firebaseapp.com",
      projectId: "flixrel",
      storageBucket: "flixrel.firebasestorage.app",
      messagingSenderId: "838788026123",
      appId: "1:838788026123:web:dfca0835a24b4816499c0e"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('id');
    
    const loadingText = document.getElementById('loading-text');
    const waitMessage = document.getElementById('wait-message');
    const videoEl = document.getElementById('video-player');
    const iframeEl = document.getElementById('iframe-player');
    
    const customControls = document.getElementById('custom-controls');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const timeDisplay = document.getElementById('time-display');
    const rewindBtn = document.getElementById('rewind-btn');
    const forwardBtn = document.getElementById('forward-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const videoWrapper = document.getElementById('video-wrapper');
    const leftTapZone = document.getElementById('left-tap-zone');
    const rightTapZone = document.getElementById('right-tap-zone');

    let isVideoReady = false;

    // Time Format Logic
    function formatTime(seconds) {
      if(isNaN(seconds)) return "00:00";
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if(h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // Toggle Play/Pause
    function togglePlay() {
      if(!isVideoReady) return;
      if (videoEl.paused) {
        videoEl.play();
        playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      } else {
        videoEl.pause();
        playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
      }
    }

    playPauseBtn.addEventListener('click', togglePlay);
    videoEl.addEventListener('click', togglePlay);

    // Progress Bar Logic
    videoEl.addEventListener('timeupdate', () => {
      if(!videoEl.duration) return;
      const progressPercent = (videoEl.currentTime / videoEl.duration) * 100;
      progressBar.value = progressPercent;
      timeDisplay.innerText = `${formatTime(videoEl.currentTime)} / ${formatTime(videoEl.duration)}`;
      progressBar.style.background = `linear-gradient(to right, #ff0000 0%, #ff0000 ${progressPercent}%, rgba(255,255,255,0.3) ${progressPercent}%, rgba(255,255,255,0.3) 100%)`;
    });

    progressBar.addEventListener('input', (e) => {
      const seekTime = (e.target.value / 100) * videoEl.duration;
      videoEl.currentTime = seekTime;
    });

    rewindBtn.addEventListener('click', () => { videoEl.currentTime -= 10; });
    forwardBtn.addEventListener('click', () => { videoEl.currentTime += 10; });

    let lastTap = 0;
    leftTapZone.addEventListener('click', () => {
      const currentTime = new Date().getTime();
      if (currentTime - lastTap < 500) videoEl.currentTime -= 10;
      lastTap = currentTime;
      showControls();
    });
    rightTapZone.addEventListener('click', () => {
      const currentTime = new Date().getTime();
      if (currentTime - lastTap < 500) videoEl.currentTime += 10;
      lastTap = currentTime;
      showControls();
    });

    // 📱 Auto-Rotate Fullscreen Magic 📱
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        const requestFS = videoWrapper.requestFullscreen || videoWrapper.webkitRequestFullscreen;
        if (requestFS) {
          requestFS.call(videoWrapper).then(() => {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(function(error) {
                console.log("Device doesn't support auto-rotation:", error);
              });
            }
          }).catch(err => console.log(err));
        }
      } else {
        const exitFS = document.exitFullscreen || document.webkitExitFullscreen;
        if (exitFS) {
          exitFS.call(document).then(() => {
            if (screen.orientation && screen.orientation.unlock) {
              screen.orientation.unlock();
            }
          });
        }
      }
    });

    videoEl.addEventListener('ended', () => {
      playPauseBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
      showControls();
    });

    // 🌟 Idle Timer Logic - অটোমেটিক কন্ট্রোল লুকানোর ম্যাজিক 🌟
    let hideControlsTimeout;
    
    function showControls() {
      customControls.classList.add('active');
      videoWrapper.classList.remove('idle');
      
      clearTimeout(hideControlsTimeout);
      
      hideControlsTimeout = setTimeout(() => {
        if (!videoEl.paused) {
          customControls.classList.remove('active');
          videoWrapper.classList.add('idle');
        }
      }, 3000);
    }

    videoWrapper.addEventListener('mousemove', showControls);
    videoWrapper.addEventListener('touchstart', showControls);
    videoWrapper.addEventListener('click', showControls);
    
    videoEl.addEventListener('play', showControls);
    videoEl.addEventListener('pause', () => {
      showControls();
      clearTimeout(hideControlsTimeout);
    });

    function startForcedBuffering() {
      let countdown = 6;
      waitMessage.innerText = `Please wait... Buffering (${countdown}s)`;
      
      const timer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          waitMessage.innerText = `Please wait... Buffering (${countdown}s)`;
        } else {
          clearInterval(timer);
          loadingText.style.display = "none";
          isVideoReady = true;
          
          customControls.classList.remove('hidden');
          leftTapZone.classList.remove('hidden');
          rightTapZone.classList.remove('hidden');
          playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
          showControls();
        }
      }, 1000);
    }

    if (!videoId) {
      loadingText.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-500"></i> Error: No video selected!';
    } else {
      db.collection("movies").doc(videoId).get().then((doc) => {
        if (!doc.exists) {
          loadingText.innerHTML = '<i class="fa-solid fa-ghost text-red-500"></i> Video not found!';
          return;
        }
        
        const data = doc.data();
        document.getElementById('video-title').innerText = data.title || "Untitled Video";
        document.getElementById('video-meta').innerText = (data.releaseYear || '') + ' • ' + (data.type || 'Viral');
        
        const videoUrl = data.videoUrl || data.embedUrl || "";

        if (videoUrl.includes('.m3u8') || videoUrl.includes('.mp4')) {
          videoEl.classList.remove('hidden');
          
          if (videoUrl.includes('.m3u8')) {
            if (Hls.isSupported()) {
              const hls = new Hls({
                startLevel: -1, 
                capLevelToPlayerSize: true, 
                maxBufferLength: 70,        
                maxMaxBufferLength: 90,     
                maxBufferSize: 120 * 1024 * 1024, 
                enableWorker: true,
                stretchShortVideoTrack: true,
                maxBufferHole: 0.5,
                maxAudioFramesDrift: 2,
                appendErrorMaxRetry: 10
              });

              hls.loadSource(videoUrl);
              hls.attachMedia(videoEl);
              
              hls.on(Hls.Events.MANIFEST_PARSED, function() {
                startForcedBuffering(); 
              });
            } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
              videoEl.src = videoUrl;
              startForcedBuffering();
            }
          } else {
            videoEl.src = videoUrl;
            startForcedBuffering();
          }
        } else {
          loadingText.style.display = "none";
          iframeEl.src = videoUrl;
          iframeEl.classList.remove('hidden');
        }
      });
    }
  </script>
